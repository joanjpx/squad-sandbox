# Contract: templates/github-actions/ in joanjpx/ai-sdlc-squad
# Dispatched by the AI SDLC Squad DevOps Agent in the ROLLBACK state:
# republishes the app at `to_ref` (the last good release) to the environment.
name: Roll back

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        type: choice
        options: [production, staging]
      to_ref:
        description: Commit or ref of the release to restore
        required: true
        type: string
      workflow_id:
        description: AI SDLC Squad workflow ID
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write # OIDC for actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the release to restore
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.to_ref }}

      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Restore previous release
        env:
          TARGET: ${{ inputs.environment }}
          TO_REF: ${{ inputs.to_ref }}
        run: |
          if [ "$TARGET" = "staging" ]; then
            rm -rf site/staging && mkdir -p site/staging
            cp -r index.html style.css src site/staging/
            git rev-parse HEAD > site/staging/version.txt
          else
            find site -mindepth 1 -maxdepth 1 ! -name staging ! -name .git -exec rm -rf {} +
            cp -r index.html style.css src site/
            git rev-parse HEAD > site/version.txt
          fi
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "rollback $TARGET to $TO_REF" || echo "No changes"
          git push origin HEAD:gh-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
